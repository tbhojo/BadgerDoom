<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; worker-src blob:; form-action 'none'; base-uri 'none'">
<title>Badger Doom — Game Data Converter</title>
<style>
  :root { color-scheme: light dark; font: 1rem/1.5 system-ui, sans-serif; }
  main { max-width: 36rem; margin: 3rem auto; padding: 0 1.25rem; }
  h1 { line-height: 1.15; }
  label { display: block; font-weight: 600; margin-bottom: .5rem; }
  input, button { font: inherit; max-width: 100%; }
  button { display: block; margin-top: 1rem; padding: .4rem .85rem; }
  a#download { font-weight: 600; }
  details { margin-top: 2rem; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1>Badger Doom Game Data Converter</h1>
  <p>Turn your Doom v1.9 shareware <code>DOOM1.WAD</code> into <code>doom1.whx</code> for the GitHub Universe 2024 Badger.</p>
  <p>This page works offline. Your WAD stays in this browser, and no game data is included.</p>
  <form id="converter">
    <label for="wad">Doom v1.9 shareware WAD</label>
    <input id="wad" type="file" accept=".wad" required>
    <button type="submit">Convert</button>
  </form>
  <p id="status" role="status"></p>
  <a id="download" download="doom1.whx" hidden>Download doom1.whx</a>
  <noscript>Enable JavaScript and WebAssembly to use this offline converter.</noscript>
  <details>
    <summary>License notices</summary>
    <pre>@converter_licenses@</pre>
  </details>
</main>
<script id="program" type="text/plain">
@converter_program@
</script>
<script id="worker" type="text/plain">
self.onmessage = async ({ data: wad }) => {
  let diagnostic = '';
  const remember = line => { if (line.trim()) diagnostic = line.trim(); };
  try {
    const converter = await createWhdConverter({ print: remember, printErr: remember });
    converter.FS.writeFile('/doom1.wad', new Uint8Array(wad), { canOwn: true });
    const result = converter.callMain(['/doom1.wad', '/doom1.whx']);
    if (result) throw new Error(diagnostic || 'The converter rejected the WAD.');
    const whx = converter.FS.readFile('/doom1.whx');
    if (whx.length < 36 || new DataView(whx.buffer, whx.byteOffset).getUint32(0) !== 0x49574858) {
      throw new Error('The converter did not produce a valid WHX.');
    }
    self.postMessage({ whx }, [whx.buffer]);
  } catch (error) {
    self.postMessage({ error: error.message || 'The converter could not run.' });
  }
};
</script>
<script>
const form = document.querySelector('#converter');
const fileInput = document.querySelector('#wad');
const button = form.querySelector('button');
const status = document.querySelector('#status');
const download = document.querySelector('#download');

function clearDownload() {
  if (download.hasAttribute('href')) URL.revokeObjectURL(download.href);
  download.removeAttribute('href');
  download.hidden = true;
  status.textContent = '';
}

fileInput.addEventListener('change', clearDownload);
form.addEventListener('submit', async event => {
  event.preventDefault();
  clearDownload();
  const file = fileInput.files[0];
  if (!file) return;
  button.disabled = fileInput.disabled = true;
  status.textContent = 'Converting…';
  let worker;
  let workerUrl;
  try {
    if (file.size !== 4196020) throw new Error('Choose DOOM1.WAD from the Doom v1.9 shareware release.');
    const wad = await file.arrayBuffer();
    if (new DataView(wad).getUint32(0) !== 0x49574144) {
      throw new Error('This file is not a Doom IWAD.');
    }
    workerUrl = URL.createObjectURL(new Blob([
      document.querySelector('#program').textContent, '\n',
      document.querySelector('#worker').textContent,
    ], { type: 'text/javascript' }));
    worker = new Worker(workerUrl);
    const whx = await new Promise((resolve, reject) => {
      worker.onmessage = ({ data }) => data.error ? reject(new Error(data.error)) : resolve(data.whx);
      worker.onerror = () => reject(new Error('Could not run the offline converter. Try a current browser.'));
      worker.postMessage(wad, [wad]);
    });
    download.href = URL.createObjectURL(new Blob([whx], { type: 'application/octet-stream' }));
    download.hidden = false;
    status.textContent = 'Conversion complete.';
  } catch (error) {
    status.textContent = error.message;
  } finally {
    if (worker) worker.terminate();
    if (workerUrl) URL.revokeObjectURL(workerUrl);
    button.disabled = fileInput.disabled = false;
  }
});
</script>
</body>
</html>
